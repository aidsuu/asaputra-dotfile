# Blue Ocean | frameless ocean terminal
font_family Noto Sans Mono
font_size 12.0

background #061522
foreground #eaf6fc
selection_background #265d78
selection_foreground #ffffff
cursor #78d6ec
cursor_text_color #061522
cursor_shape beam
cursor_blink_interval 0
url_color #79d4ec

color0  #102b3c
color1  #e38791
color2  #83c7b5
color3  #e2c48a
color4  #78b9e5
color5  #b0a8db
color6  #70c9d6
color7  #d3e7f0
color8  #537084
color9  #f0a3aa
color10 #a7decb
color11 #eed7a2
color12 #9bd0f0
color13 #c9c0ec
color14 #9cdee6
color15 #f4fbff

hide_window_decorations yes
remember_window_size no
initial_window_width 960
initial_window_height 560
window_padding_width 24
placement_strategy center

# A dimmed crop of the desktop wallpaper adds depth without showing windows below.
background_image ~/.local/share/backgrounds/blue-ocean.png
background_image_layout cscaled
background_image_linear yes
background_tint 0.87
background_opacity 1.0

tab_bar_style powerline
tab_bar_min_tabs 2
tab_powerline_style round
active_tab_background #24627d
active_tab_foreground #f3fbff
inactive_tab_background #0b2535
inactive_tab_foreground #8fb2c4
confirm_os_window_close 0
