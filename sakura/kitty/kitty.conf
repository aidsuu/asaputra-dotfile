# Sakura | calm plum terminal
font_family Noto Sans Mono
font_size 12.0

background #1c1520
foreground #e8d9df
selection_background #5b3548
selection_foreground #fff2f6
cursor #c98fa9
cursor_text_color #1c1520
cursor_shape beam
cursor_blink_interval 0
url_color #bd93b5

color0  #261b2a
color1  #d889a4
color2  #9ec1ae
color3  #e2bd8f
color4  #a9a1d3
color5  #c99bc6
color6  #91b4bf
color7  #decdd4
color8  #6a5268
color9  #e8a0b4
color10 #b7d0bc
color11 #eacda7
color12 #c0b5df
color13 #ddb3d2
color14 #a6cbd1
color15 #f5e8ee

hide_window_decorations yes
remember_window_size no
initial_window_width 960
initial_window_height 560
window_padding_width 24
placement_strategy center

background_image ~/.local/share/backgrounds/sakura.png
background_image_layout cscaled
background_image_linear yes
background_tint 0.91
background_opacity 1.0

tab_bar_style powerline
tab_bar_min_tabs 2
tab_powerline_style round
active_tab_background #674258
active_tab_foreground #f5e9ee
inactive_tab_background #2c1e31
inactive_tab_foreground #b99fad
confirm_os_window_close 0
